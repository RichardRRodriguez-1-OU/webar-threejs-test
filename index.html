<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Museum of Commerce Extended Content</title>
  <style>
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#111; font-family:system-ui,sans-serif; }
    #ar-container { position:fixed; inset:0; }
    #ui { position:fixed; z-index:10; top:16px; left:16px; right:16px; display:flex; gap:10px; align-items:center; }
    button { padding:12px 16px; border:0; border-radius:8px; background:#fff; color:#111; font-weight:600; }
    #status { background:#111c; color:white; border-radius:8px; padding:10px; font-size:13px; }
    #overlay { position:fixed; inset:0; z-index:20; display:grid; place-content:center; text-align:center; background:#111; color:white; padding:20px; }
    #overlay button { margin:12px auto; }
    #overlay[hidden] { display:none; }
  </style>
</head>
<body>
  <div id="ar-container"></div>
  <div id="ui"><button id="mute" disabled>Mute</button><button id="stop" disabled>Exit AR</button><span id="status" role="status">Ready</span></div>
  <div id="overlay"><h1>The Extended Museum</h1><p>Point the camera at a marker to view extended content.</p><button id="start">Start AR</button><p id="error" role="alert"></p></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
